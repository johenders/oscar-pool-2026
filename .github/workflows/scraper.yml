name: Oscar Results Scraper

on:
  schedule:
    # Toutes les 5 minutes, dimanche 15 mars 2026 entre 20h et 2h (EST = UTC-5)
    # 20h EST = 01h00 UTC  |  02h EST = 07h00 UTC
    - cron: '*/5 1-7 15 3 0'

  # Permet aussi de lancer manuellement depuis GitHub
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install node-fetch firebase-admin

      - name: Scrape & Push to Firebase
        env:
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scraper.js
